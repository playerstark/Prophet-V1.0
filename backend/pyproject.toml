[project]
name = "prophet-v1"
version = "1.0.0"
description = "Multi-market stock intelligence & AI trading platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "yfinance==1.6.0",
    "pandas==2.1.3",
    "numpy==1.24.3",
    "requests==2.31.0",
    "feedparser==6.0.10",
    "httpx==0.25.1",
    "pydantic==2.5.0",
    "python-dotenv==1.0.0",
    "apscheduler==3.10.4",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
]

[project.optional-dependencies]
dev = [
    "black==23.12.0",
    "flake8==6.1.0",
    "mypy==1.7.0",
]
